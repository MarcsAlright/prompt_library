<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <header class="header">
            <div class="logo">
                <span class="logo-icon">◈</span>
                <h1>Prompt Library</h1>
            </div>
            <p class="tagline">Colección de Prompts & Master Prompts</p>
        </header>

        <section class="selectors">
            <div class="select-group">
                <label for="category-select">Categoría</label>
                <div class="select-wrapper">
                    <select id="category-select">
                        <option value="">Selecciona una categoría</option>
                    </select>
                </div>
            </div>
            <div class="select-group">
                <label for="prompt-select">Prompt</label>
                <div class="select-wrapper">
                    <select id="prompt-select" disabled>
                        <option value="">—</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="viewer">
            <div class="viewer-bar">
                <span class="viewer-title" id="prompt-title">
                    <span class="dot"></span>
                    Ningún prompt seleccionado
                </span>
                <div class="viewer-actions">
                    <span class="char-count" id="char-count"></span>
                    <button id="copy-btn" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span id="copy-text">Copiar</span>
                    </button>
                </div>
            </div>
            <textarea id="prompt-display" readonly
                placeholder="Selecciona una categoría y un prompt..."></textarea>
        </section>

        <div id="toast" class="toast"></div>

        <footer class="footer">
            <p>Prompt Library <span class="version">v1.0</span></p>
        </footer>

    </div>

    <!-- Primero data.js, luego app.js -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
