<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Library</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="prompts.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --mint: #3fffa2;
      --mint-dim: #2dd68a;
      --mint-glow: rgba(63, 255, 162, 0.15);
      --mint-glow-strong: rgba(63, 255, 162, 0.25);
      --bg-base: #0d0f12;
      --bg-surface: #13161c;
      --bg-elevated: #1a1e27;
      --bg-hover: #1f2433;
      --border: #22283a;
      --border-light: #2a3248;
      --text-primary: #e8eaf0;
      --text-secondary: #7a8399;
      --text-muted: #4a5270;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--mint-dim); }

    /* ── Noise texture overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ── Layout ── */
    .app-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.25rem 4rem;
    }

    /* ── Header ── */
    .header {
      width: 100%;
      max-width: 760px;
      margin-bottom: 3rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--mint-glow);
      border: 1px solid rgba(63, 255, 162, 0.3);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 18px;
      height: 18px;
      fill: var(--mint);
    }

    .app-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .app-title span {
      color: var(--mint);
    }

    .app-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.01em;
      margin-left: 48px;
    }

    .header-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--mint) 0%, transparent 60%);
      opacity: 0.25;
      margin-top: 1rem;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 760px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 24px 60px rgba(0,0,0,0.4);
    }

    /* ── Select Label ── */
    .field-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    /* ── Custom Select ── */
    .select-wrapper {
      position: relative;
    }

    .custom-select {
      width: 100%;
      appearance: none;
      background: var(--bg-elevated);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.85rem 3rem 0.85rem 1.1rem;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
    }

    .custom-select:hover {
      border-color: rgba(63, 255, 162, 0.35);
      background: var(--bg-hover);
    }

    .custom-select:focus {
      border-color: var(--mint);
      box-shadow: 0 0 0 3px var(--mint-glow);
    }

    .custom-select option {
      background: var(--bg-elevated);
      color: var(--text-primary);
      padding: 0.5rem;
    }

    .select-arrow {
      position: absolute;
      right: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--mint);
      transition: transform 0.2s;
    }

    /* ── Prompt count badge ── */
    .count-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--mint-glow);
      border: 1px solid rgba(63, 255, 162, 0.2);
      border-radius: 99px;
      padding: 0.2rem 0.7rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--mint);
      letter-spacing: 0.05em;
    }

    /* ── Prompt display area ── */
    .prompt-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .prompt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .prompt-title-display {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prompt-title-display.empty {
      color: var(--text-muted);
      font-style: italic;
      font-weight: 400;
    }

    /* ── Text block ── */
    .prompt-box {
      position: relative;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .prompt-box.has-content {
      border-color: var(--border-light);
    }

    .prompt-box.has-content:hover {
      border-color: rgba(63, 255, 162, 0.2);
      box-shadow: 0 0 20px rgba(63, 255, 162, 0.04);
    }

    .prompt-text {
      display: block;
      width: 100%;
      min-height: 220px;
      max-height: 420px;
      overflow-y: auto;
      padding: 1.25rem 1.25rem 4.5rem 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.75;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
      background: transparent;
    }

    .prompt-text.empty-state {
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 220px;
    }

    /* ── Copy button (floating inside box) ── */
    .copy-btn-wrapper {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem 1.25rem;
      background: linear-gradient(to top, var(--bg-base) 60%, transparent 100%);
      display: flex;
      justify-content: flex-end;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--mint);
      color: #0a0d11;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      border: none;
      border-radius: 10px;
      padding: 0.6rem 1.25rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 20px rgba(63, 255, 162, 0.3);
      user-select: none;
    }

    .copy-btn:hover:not(:disabled) {
      background: #5fffb4;
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(63, 255, 162, 0.45);
    }

    .copy-btn:active:not(:disabled) {
      transform: translateY(0px);
      box-shadow: 0 2px 12px rgba(63, 255, 162, 0.3);
    }

    .copy-btn:disabled {
      background: var(--bg-hover);
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    .copy-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* ── Copy success state ── */
    .copy-btn.copied {
      background: #0a2e1c;
      color: var(--mint);
      border: 1px solid rgba(63,255,162,0.3);
      box-shadow: 0 0 20px rgba(63, 255, 162, 0.15);
    }

    /* ── Char count ── */
    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.25rem;
    }

    .char-count {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* ── Placeholder animated icon ── */
    .empty-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      opacity: 0.4;
    }

    .empty-icon svg {
      width: 40px;
      height: 40px;
      color: var(--mint);
    }

    /* ── Footer ── */
    .footer {
      width: 100%;
      max-width: 760px;
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .footer strong {
      color: var(--mint);
      font-weight: 600;
    }

    /* ── Fade-in animation ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card { animation: fadeUp 0.4s ease both; }

    /* ── Glow transition on prompt load ── */
    @keyframes promptGlow {
      0%   { border-color: rgba(63,255,162,0.5); box-shadow: 0 0 30px rgba(63,255,162,0.12); }
      100% { border-color: var(--border-light); box-shadow: none; }
    }

    .prompt-box.flash {
      animation: promptGlow 0.8s ease forwards;
    }

    /* ── Toast notification ── */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--bg-elevated);
      border: 1px solid rgba(63, 255, 162, 0.3);
      border-radius: 12px;
      padding: 0.7rem 1.25rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--mint);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
      opacity: 0;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ── Quick search ── */
    .search-wrapper {
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-secondary);
      font-family: 'Inter', sans-serif;
      font-size: 0.83rem;
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-input:focus {
      border-color: rgba(63, 255, 162, 0.3);
      box-shadow: 0 0 0 3px var(--mint-glow);
      color: var(--text-primary);
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .card { padding: 1.25rem; }
      .prompt-text { font-size: 0.78rem; }
      .app-title { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">

    <!-- ── Header ── -->
    <header class="header">
      <div class="logo-row">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 5h16v2H4V5zm0 4h10v2H4V9zm0 4h16v2H4v-2zm0 4h10v2H4v-2z"/>
          </svg>
        </div>
        <h1 class="app-title">Prompt <span>Library</span></h1>
      </div>
      <p class="app-subtitle">Selecciona un prompt y cópialo al instante</p>
      <div class="header-divider"></div>
    </header>

    <!-- ── Main card ── -->
    <main class="card" id="mainCard">

      <!-- Selector row -->
      <div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.5rem;">
          <p class="field-label">Seleccionar prompt</p>
          <span class="count-badge" id="promptCount">
            <svg viewBox="0 0 16 16" width="10" height="10" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 1.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zm.75 8.25v1.5h-1.5v-1.5h1.5zm0-6v4.5h-1.5v-4.5h1.5z"/></svg>
            0 prompts
          </span>
        </div>

        <!-- Search -->
        <div class="search-wrapper" style="margin-bottom:0.6rem;">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input class="search-input" type="text" id="searchInput" placeholder="Buscar por título..." autocomplete="off" />
        </div>

        <!-- Dropdown -->
        <div class="select-wrapper">
          <select class="custom-select" id="promptSelect">
            <option value="" disabled selected>— Elige un prompt —</option>
          </select>
          <svg class="select-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </div>
      </div>

      <!-- Prompt display -->
      <div class="prompt-section">
        <div class="prompt-header">
          <span class="prompt-title-display empty" id="selectedTitle">Ningún prompt seleccionado</span>
        </div>

        <div class="prompt-box" id="promptBox">
          <div class="prompt-text" id="promptDisplay">
            <!-- Empty state -->
            <div class="empty-icon" id="emptyState">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              <span>Selecciona un prompt del menú</span>
            </div>
          </div>
          <!-- Copy button floating -->
          <div class="copy-btn-wrapper">
            <button class="copy-btn" id="copyBtn" disabled>
              <svg id="copyIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
              </svg>
              <span id="copyLabel">Copiar prompt</span>
            </button>
          </div>
        </div>

        <!-- Meta bar -->
        <div class="meta-bar">
          <span class="char-count" id="charCount"></span>
        </div>
      </div>

    </main>

    <!-- ── Footer ── -->
    <footer class="footer">
      <strong>Prompt Library</strong> — Edita <code style="color:var(--text-secondary)">prompts.js</code> para agregar o actualizar tus prompts
    </footer>

  </div>

  <!-- ── Toast ── -->
  <div class="toast" id="toast">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
    ¡Prompt copiado al portapapeles!
  </div>

  <script>
    // ── State ──
    let filteredPrompts = [];
    let currentPrompt   = null;

    // ── DOM refs ──
    const selectEl      = document.getElementById('promptSelect');
    const searchInput   = document.getElementById('searchInput');
    const promptDisplay = document.getElementById('promptDisplay');
    const promptBox     = document.getElementById('promptBox');
    const copyBtn       = document.getElementById('copyBtn');
    const copyLabel     = document.getElementById('copyLabel');
    const copyIcon      = document.getElementById('copyIcon');
    const selectedTitle = document.getElementById('selectedTitle');
    const charCount     = document.getElementById('charCount');
    const promptCount   = document.getElementById('promptCount');
    const emptyState    = document.getElementById('emptyState');
    const toast         = document.getElementById('toast');

    // ── Init ──
    function init() {
      filteredPrompts = [...PROMPTS];
      renderSelect(filteredPrompts);
      updateCount(PROMPTS.length);
    }

    // ── Render <select> options ──
    function renderSelect(list) {
      // Save current value
      const prev = selectEl.value;

      // Clear options (keep placeholder)
      selectEl.innerHTML = '<option value="" disabled>— Elige un prompt —</option>';

      list.forEach((p, i) => {
        const opt = document.createElement('option');
        // Use index from original PROMPTS array as value for stability
        opt.value = PROMPTS.indexOf(p);
        opt.textContent = p.title;
        selectEl.appendChild(opt);
      });

      // Restore selection if still valid
      if (prev && selectEl.querySelector(`option[value="${prev}"]`)) {
        selectEl.value = prev;
      } else {
        selectEl.value = '';
        if (!list.find(p => PROMPTS.indexOf(p) === parseInt(currentPrompt?.idx))) {
          clearDisplay();
        }
      }
    }

    function updateCount(n) {
      promptCount.innerHTML = `
        <svg viewBox="0 0 16 16" width="10" height="10" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 1.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zm.75 8.25v1.5h-1.5v-1.5h1.5zm0-6v4.5h-1.5v-4.5h1.5z"/></svg>
        ${n} prompt${n !== 1 ? 's' : ''}
      `;
    }

    // ── Display prompt ──
    function displayPrompt(idx) {
      const p = PROMPTS[idx];
      if (!p) return;

      currentPrompt = { idx, ...p };

      // Title
      selectedTitle.textContent = p.title;
      selectedTitle.classList.remove('empty');

      // Text
      promptDisplay.innerHTML = '';
      const pre = document.createElement('span');
      pre.style.cssText = 'display:block; white-space:pre-wrap; word-break:break-word; font-family:"JetBrains Mono",monospace; font-size:0.82rem; line-height:1.75; color:var(--text-primary); padding:1.25rem 1.25rem 4.5rem;';
      pre.textContent = p.prompt;
      promptDisplay.appendChild(pre);

      // Meta
      const len = p.prompt.trim().length;
      const words = p.prompt.trim().split(/\s+/).length;
      charCount.textContent = `${words} palabras · ${len} caracteres`;

      // Box state
      promptBox.classList.add('has-content');
      flashBox();

      // Enable copy
      copyBtn.disabled = false;
      resetCopyBtn();
    }

    function clearDisplay() {
      currentPrompt = null;
      selectedTitle.textContent = 'Ningún prompt seleccionado';
      selectedTitle.classList.add('empty');
      promptDisplay.innerHTML = `
        <div class="empty-icon" id="emptyState">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <span>Selecciona un prompt del menú</span>
        </div>`;
      charCount.textContent = '';
      promptBox.classList.remove('has-content');
      copyBtn.disabled = true;
      resetCopyBtn();
    }

    function flashBox() {
      promptBox.classList.remove('flash');
      void promptBox.offsetWidth; // reflow
      promptBox.classList.add('flash');
    }

    // ── Copy to clipboard ──
    async function copyPrompt() {
      if (!currentPrompt) return;
      try {
        await navigator.clipboard.writeText(currentPrompt.prompt);
        // Button feedback
        copyBtn.classList.add('copied');
        copyIcon.innerHTML = '<path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
        copyLabel.textContent = '¡Copiado!';
        // Toast
        showToast();
        // Reset after 2.5s
        setTimeout(resetCopyBtn, 2500);
      } catch {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = currentPrompt.prompt;
        ta.style.cssText = 'position:fixed;opacity:0;';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast();
      }
    }

    function resetCopyBtn() {
      copyBtn.classList.remove('copied');
      copyIcon.innerHTML = `
        <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2.2"/>
        <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="2.2"/>
      `;
      copyLabel.textContent = 'Copiar prompt';
    }

    // ── Toast ──
    let toastTimer;
    function showToast() {
      clearTimeout(toastTimer);
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // ── Search / filter ──
    function filterPrompts(query) {
      const q = query.trim().toLowerCase();
      filteredPrompts = q
        ? PROMPTS.filter(p => p.title.toLowerCase().includes(q))
        : [...PROMPTS];

      renderSelect(filteredPrompts);
      updateCount(filteredPrompts.length);
    }

    // ── Events ──
    selectEl.addEventListener('change', () => {
      const idx = parseInt(selectEl.value);
      if (!isNaN(idx)) displayPrompt(idx);
    });

    searchInput.addEventListener('input', (e) => {
      filterPrompts(e.target.value);
    });

    // Clear search on Escape
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchInput.value = '';
        filterPrompts('');
        searchInput.blur();
      }
    });

    copyBtn.addEventListener('click', copyPrompt);

    // Keyboard shortcut: Cmd/Ctrl + Shift + C
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'C') {
        e.preventDefault();
        copyPrompt();
      }
    });

    // ── Bootstrap ──
    init();
  </script>
</body>
</html>
